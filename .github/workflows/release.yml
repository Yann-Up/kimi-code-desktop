name: Release

# 发版流程:改版本号(tauri.conf.json / Cargo.toml / package.json 三处保持一致)
# → commit → git tag vX.Y.Z → git push --tags → 本 workflow 自动构建 Windows NSIS 安装包
# 与 macOS dmg(仅 Apple Silicon/aarch64,未签名,首次打开需右键→打开绕过 Gatekeeper)、
# → 用 TAURI_SIGNING_PRIVATE_KEY 签名、生成 latest.json(含 windows/macos 双平台)、
# 打包绿色免安装 exe zip,并创建草稿 Release 并上传全部产物;
# 在 Releases 页面确认后手动发布为正式版,旧版客户端即可自动检测到更新。
#
# 需要的一次性仓库 Secrets(Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  本地私钥文件内容(开发机 ~/.tauri/kimi-desktop.key)
#   (私钥未设密码,无需 TAURI_SIGNING_PRIVATE_KEY_PASSWORD)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发版 tag(需已存在,如 v0.3.5)"
        required: true
        type: string

permissions:
  contents: write # 创建 Release / 上传产物

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tauri-action:构建(bundle.createUpdaterArtifacts 产出 .nsis.zip + .sig)
      # → minisign 签名 → 生成 latest.json → 创建草稿 Release 并上传全部产物
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Kimi Code Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false

      # 产物校验:NSIS/MSI 安装器各一且 updater 签名齐全
      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $nsis = @(Get-ChildItem "$bundleRoot/nsis" -File -Filter "*-setup.exe")
          $msi = @(Get-ChildItem "$bundleRoot/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)." }
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)." }
          foreach ($f in @($nsis[0], $msi[0])) {
            if (-not (Test-Path "$($f.FullName).sig" -PathType Leaf)) { throw "Missing updater signature for $($f.Name)." }
          }

      # 绿色免安装版:tauri build 的编译产物 exe 直接打 zip(独立分发,不走安装器)
      # 注意:仍需系统装有 WebView2 运行时(Win10 1803+ 一般自带)
      - name: Package portable exe
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          Compress-Archive -Path "src-tauri/target/release/kimi-desktop-tauri.exe" -DestinationPath "Kimi-Code-Desktop_${ver}_x64-portable.zip" -Force

      # 上传至上一步创建的草稿 Release
      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" "Kimi-Code-Desktop_*_x64-portable.zip" --clobber

  # macOS 构建:仅 Apple Silicon(macos-latest 即 aarch64 runner,默认目标 aarch64-apple-darwin)。
  # 未做 Developer ID 签名/公证,产物为未签名 dmg;若后续要签名,加 APPLE_CERTIFICATE /
  # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 等 secrets 即可。
  # 串行跟在 Windows job 之后:tauri-action 会把 Release 上已有的 Windows 签名产物
  # 合并进 latest.json,并行跑两个 job 会互相覆盖丢平台。
  release-macos:
    needs: release-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 编译期部署目标,与 bundle.macOS.minimumSystemVersion 对齐
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Kimi Code Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false

      # 产物校验:arm64 架构 / adhoc 签名(无 Apple 签名链)/ dmg 与 updater 产物各一
      - name: Verify macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          bundle_root="src-tauri/target/release/bundle"
          app_path="$bundle_root/macos/Kimi Code Desktop.app"
          test -d "$app_path"
          plutil -lint "$app_path/Contents/Info.plist"
          lipo "$app_path/Contents/MacOS/kimi-desktop-tauri" -verify_arch arm64
          sig="$(codesign -dvv "$app_path" 2>&1)"
          grep -q 'Signature=adhoc' <<<"$sig" || { echo "期望 adhoc 签名(未配置 Developer ID)"; exit 1; }
          if grep -q '^Authority=' <<<"$sig"; then echo "不应存在 Apple 签名链"; exit 1; fi
          test "$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" = "1"
